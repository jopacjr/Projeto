<body>
  <div class="auth-container">
    <h2>{{isLoginMode ? 'Login' : 'Cadastro'}}</h2>

    <form (submit)="OnSubmit()">

      <div *ngIf="!isLoginMode">
        <label for="name">Nome :</label>
        <input id="name" name="name">
      </div>

      <label for="email">Email :</label>
      <input id="email" name="email" type="email">

      <label for="password">Senha :</label>
      <input id="password" name="password" type="password" [placeholder]="isLoginMode ? '' : 'Informe pelo menos 6 digitos'">

      <button type="submit">{{isLoginMode ? 'Entrar' : 'Cadastrar'}}</button>

    </form>

    <p>
      {{isLoginMode ? 'Não tem conta?' : 'Já tem conta?'}}
      <button type="button" (click)="toggleMode()">{{isLoginMode ? 'Criar conta' : 'Fazer login'}}</button>
    </p>
  </div>
</body>
